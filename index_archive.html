<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Actualités ASCO</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#24242b;background:#f8f7f8}*{box-sizing:border-box}body{margin:0}.content{max-width:1160px;margin:auto;padding:24px clamp(14px,3vw,36px) 70px}.status{padding:26px;border-radius:14px;background:white;color:#555}.edition{background:white;border:1px solid #eee7ec;border-radius:18px;padding:clamp(20px,3.4vw,42px);margin:0 0 28px;box-shadow:0 8px 28px rgba(45,20,35,.045);overflow:hidden}.edition:first-child{border-top:5px solid #b52a66}.edition img{max-width:100%;height:auto}.edition p{line-height:1.78;margin:0 0 15px}.edition h1,.edition h2,.edition h3{line-height:1.25;color:#a82260;margin:0 0 20px}.edition a{color:#a82260}.edition figure{margin:12px 0}.edition ul,.edition ol{line-height:1.7}.edition .wp-block-gallery,.edition .blocks-gallery-grid{display:flex!important;flex-wrap:wrap!important;align-items:stretch;gap:12px;margin:24px 0;padding:0;list-style:none}.edition .wp-block-gallery>figure,.edition .blocks-gallery-grid>li,.edition .blocks-gallery-grid>figure{flex:1 1 calc(33.333% - 12px);min-width:0;margin:0!important}.edition .wp-block-gallery.columns-2>figure,.edition .blocks-gallery-grid.columns-2>li,.edition .has-2-columns>li{flex-basis:calc(50% - 12px)}.edition .wp-block-gallery.columns-3>figure,.edition .blocks-gallery-grid.columns-3>li,.edition .has-3-columns>li{flex-basis:calc(33.333% - 12px)}.edition .wp-block-gallery.columns-4>figure,.edition .blocks-gallery-grid.columns-4>li,.edition .has-4-columns>li{flex-basis:calc(25% - 12px)}.edition .wp-block-gallery img,.edition .blocks-gallery-grid img{width:100%!important;height:auto!important;aspect-ratio:auto;object-fit:contain;border-radius:8px;display:block}.edition .wp-block-gallery figure,.edition .blocks-gallery-item figure{height:auto}.edition .wp-block-gallery figcaption{position:static!important;background:none!important;color:#666!important;padding:5px 0!important}.edition .wp-block-columns:not(.is-not-stacked-on-mobile){display:flex;flex-wrap:nowrap;gap:18px}.edition .wp-block-column{min-width:0;flex:1}.edition hr,.edition .wp-block-separator{border:0;border-top:1px solid #e7d9e0;margin:26px 0}.edition .wp-block-spacer{max-height:48px}.edition .wp-block-image img{border-radius:12px}.edition .wp-block-columns{display:flex;gap:20px;flex-wrap:wrap}.edition .wp-block-column{flex:1 1 230px}.edition .alignwide,.edition .alignfull{max-width:100%;width:100%;margin-left:auto;margin-right:auto}.edition iframe{max-width:100%}.edition .wp-block-gallery figcaption{font-size:12px}.edition blockquote{border-left:4px solid #b52a66;margin:20px 0;padding:8px 18px;background:#fff8fb}.edition .wp-block-buttons{display:flex;gap:12px;flex-wrap:wrap}.edition .wp-block-button__link{background:#a82260;color:white;border-radius:30px;padding:10px 18px;text-decoration:none}.edition .wp-block-separator{border-top:1px solid #e7d9e0}@media(max-width:680px){.content{padding:12px 12px 45px}.edition{border-radius:13px;padding:20px 16px;margin-bottom:16px}.edition .wp-block-gallery,.edition .blocks-gallery-grid{gap:7px}.edition .wp-block-gallery>figure,.edition .blocks-gallery-grid>li{flex-basis:calc(50% - 7px)!important}.edition .wp-block-columns:not(.is-not-stacked-on-mobile){flex-wrap:wrap}.edition .wp-block-column{flex-basis:100%}}

/* Menu mensuel identique à la Gazette */
.asco-archive{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px clamp(14px,3vw,36px);background:#fff;border-bottom:1px solid #f6d3e5;font-family:Arial,Helvetica,sans-serif}
.asco-archive label{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#765968}
.asco-archive select{max-width:100%;min-width:210px;padding:9px 34px 9px 12px;border:1px solid #e9a9ca;border-radius:8px;background:#fff7fb;color:#a3206b;font:700 13px Arial,Helvetica,sans-serif;cursor:pointer}
.asco-archive select:focus{outline:2px solid #e8368f;outline-offset:2px}
@media(max-width:560px){.asco-archive{justify-content:flex-start;flex-wrap:wrap;padding:10px 14px}.asco-archive select{width:100%;min-width:0}}
.asco-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 16px;padding:16px clamp(14px,2.5vw,28px);border-bottom:1px solid #f3c9df;border-top:3px solid #e8368f;background:linear-gradient(110deg,#fff 0%,#fff8fb 100%);font-family:Arial,Helvetica,sans-serif}
.asco-head__main{min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:12px;row-gap:3px}
.asco-head__eyebrow{grid-column:1/-1;color:#a3206b;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.asco-head h1{margin:0;color:#442b3a;font-size:clamp(21px,3vw,30px);line-height:1.12;font-weight:700;letter-spacing:-.5px}
.asco-head__date{color:#e0338a;font-size:12px;font-weight:700;white-space:nowrap}
.asco-head__highlight{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;padding:9px 13px;border:1px solid #f2c0d9;border-radius:8px;background:#fff;color:#a3206b;font-size:12px;white-space:nowrap}
.asco-head__highlight strong{font-size:17px;color:#e0338a}
.asco-head__highlight span{color:#765968}

@media(max-width:560px){.asco-head{align-items:flex-start;flex-direction:column;gap:10px;padding:13px 14px}.asco-head__main{grid-template-columns:1fr;gap:3px}.asco-head__eyebrow{grid-column:auto}}
.asco-head{max-width:1160px;margin:0 auto 8px;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
.asco-head *{box-sizing:border-box}

/* Harmonie graphique avec la Gazette mensuelle */
:root{background:#fff;color:#3a2a33}
body{background:#fff;font-family:Georgia,'Times New Roman',serif}
.asco-archive{max-width:1200px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid #f6d3e5}
.asco-head{max-width:1200px;margin:0 auto 10px;border-top:3px solid #e8368f;border-bottom:1px solid #f3c9df}
.content{max-width:1200px;padding:8px clamp(14px,2.5vw,28px) 50px;background:#fff}
.edition{background:#fff;border:0;border-radius:0;box-shadow:none;padding:8px 0 20px;margin:0 0 20px;overflow:visible;border-bottom:2px solid #f6d3e5}
.edition:first-child{border-top:0}
.edition h1,.edition h2,.edition h3{font-family:Arial,Helvetica,sans-serif;color:#e0338a;letter-spacing:.025em}
.edition h2{font-size:19px;border-bottom:2px solid #f6d3e5;padding-bottom:8px}
.edition p,.edition li{line-height:1.65;color:#3a2a33}
.edition .wp-block-gallery,.edition .blocks-gallery-grid{gap:10px}
.edition .wp-block-gallery img,.edition .blocks-gallery-grid img,.edition .wp-block-image img{border:1px solid #f3b6d6;border-radius:7px}
.edition .wp-block-columns{gap:16px}
.edition hr,.edition .wp-block-separator{border-top:2px solid #f6d3e5}
.edition blockquote{background:#fde3f0;border-left:4px solid #e8368f;border-radius:5px}
.edition .wp-block-button__link{background:#e8368f}
.status{border:1px solid #f6d3e5;background:#fff7fb;color:#765968}
@media(max-width:680px){.content{padding:8px 14px 32px}.edition{padding:8px 0 18px;margin-bottom:18px}.asco-head{margin-bottom:8px}}
</style></head><body><nav aria-label="Archives mensuelles des actualités" class="asco-archive">
<label for="asco-month">Éditions :</label>
<select aria-label="Choisir un mois" id="asco-month" onchange="if(this.value)window.location.href=this.value">
<option value="index.html" >Septembre 2026</option>
<option value="index_archive.html " selected>Archive</option>

</select></nav><div aria-label="La Gazette de l’ASCO" class="asco-head"><div class="asco-head__main"><span class="asco-head__eyebrow">ASCO TEAM RUNNING</span><h1>La Gazette de l’ASCO</h1><span class="asco-head__date">Archive</span></div></div><main class="content" id="actualites"><div class="status">Chargement des actualités de l’ASCO…</div></main><script>
(async()=>{const el=document.getElementById('actualites');const base='https://ascoteamrunning.fr';const endpoints=[`${base}/wp-json/wp/v2/pages?slug=team-asco&_fields=content,title`,`${base}/wp-json/wp/v2/posts?slug=team-asco&_fields=content,title`];for(const url of endpoints){try{const res=await fetch(url,{mode:'cors'});if(!res.ok)continue;const data=await res.json();if(!data.length||!data[0].content?.rendered)continue;const parsed=new DOMParser().parseFromString(data[0].content.rendered,'text/html');parsed.querySelectorAll('script,style,iframe,form').forEach(n=>n.remove());parsed.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){if(a.name.startsWith('on'))n.removeAttribute(a.name);if(['href','src','srcset'].includes(a.name)){const v=a.value;if(/^javascript:/i.test(v))n.removeAttribute(a.name);else if(v.startsWith('/'))n.setAttribute(a.name,base+v)}}});// Supprime le titre « Actualités » et son séparateur immédiatement associé.
const headings=[...parsed.body.querySelectorAll('h1,h2,h3,.wp-block-heading')];
for(const heading of headings){
 if(/^actualit(?:é|e)s?\s*$/i.test(heading.textContent.trim())){
   let next=heading.nextElementSibling;
   while(next && next.matches('.wp-block-spacer')) next=next.nextElementSibling;
   if(next && next.matches('hr,.wp-block-separator')) next.remove();
   heading.remove();
 }
}
const fragment=document.createDocumentFragment();let card=document.createElement('article');card.className='edition';const add=()=>{if(card.childNodes.length)fragment.append(card);card=document.createElement('article');card.className='edition'};for(const node of [...parsed.body.childNodes]){if(node.nodeType===1&&(node.matches('hr, .wp-block-separator')||node.querySelector(':scope > hr.wp-block-separator'))){add();continue}card.append(document.importNode(node,true))}add();el.replaceChildren(fragment);return}catch(e){console.warn('Chargement ASCO',e)}}el.innerHTML='<div class="status"><strong>Les actualités ne peuvent pas être chargées automatiquement.</strong><p>Vérifie que l’API WordPress est accessible depuis GitHub Pages.</p><p><a href="https://ascoteamrunning.fr/team-asco/">Consulter les actualités originales</a></p></div>'})();
</script></body></html>
